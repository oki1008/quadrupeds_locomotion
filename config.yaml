#シミュレーション環境・ロボット制御・地形・初期位置の設定
env_cfg:
  #go2の制御する関節数　4脚×3関節 = 12
  num_actions: 12
  # Go2の初期関節角度
  default_joint_angles:  # [rad]
    FL_hip_joint: 0.1
    FR_hip_joint: -0.1
    RL_hip_joint: 0.1
    RR_hip_joint: -0.1
    FL_thigh_joint: 0.8
    FR_thigh_joint: 0.8
    RL_thigh_joint: 0.8
    RR_thigh_joint: 0.8
    FL_calf_joint: -1.5
    FR_calf_joint: -1.5
    RL_calf_joint: -1.5
    RR_calf_joint: -1.5
  dof_names:
    - FR_hip_joint
    - FR_thigh_joint
    - FR_calf_joint
    - FL_hip_joint
    - FL_thigh_joint
    - FL_calf_joint
    - RR_hip_joint
    - RR_thigh_joint
    - RR_calf_joint
    - RL_hip_joint
    - RL_thigh_joint
    - RL_calf_joint
  # PD制御ゲイン
  kp: 25.0
  kd: 0.5
  # 転倒判定 胴体のroll/pitchがこれを超えると転倒扱い
  termination_if_roll_greater_than: 1.0  # degree→rad
  termination_if_pitch_greater_than: 1.0  # degree→rad
  # 初期姿勢
  base_init_pos: [0.0, 0.0, 0.42]
  base_init_quat: [1.0, 0.0, 0.0, 0.0]
  episode_length_s: 20.0
  resampling_time_s: 4.0
  action_scale: 0.25
  simulate_action_latency: true
  # go2_lidar4で歩けた設定を基準に、まず平地のblind歩行を安定させる
  clip_actions: 100.0
  target_dof_pos_clip: 0.8
  sim_substeps: 30 #4

  # 地形設定: flat, stair, rough
  terrain_type: "flat"
  terrain_width: 20.0
  terrain_length: 20.0
  horizontal_scale: 0.05
  stair_start_x: 0.5
  stair_end_x: 4.0
  terrain_step_width: 0.35
  terrain_step_height: 0.00 # 階段評価では0.01 -> 0.02 -> 0.03のように段階的に上げる
  start_flat_radius_cells: 20
  
  # 初期位置・高さ
  spawn_x_range: [-0.3, 0.3]
  spawn_y_range: [-0.3, 0.3]
  spawn_height_offset: 0.45

  # 終了条件の胴体高さ
  termination_abs_min_height: 0.12
  termination_max_height: 1.2

# policyに渡す観測の設定
obs_cfg:
  # 受動車輪4関節の角速度を観測に入れる
  use_wheel_vel_obs: true
  # 観測に高さ情報を入れる
  use_height_obs: false
  num_history: 3
  obs_scales:
    lin_vel: 2.0
    ang_vel: 0.25
    dof_pos: 1.0
    dof_vel: 0.05
    height_measurements: 1.0

reward_cfg:
  tracking_sigma: 0.25
  # go2_lidar4で歩けた基準高さ。まず安定歩行を優先する。
  base_height_target: 0.29
  feet_height_target: 0.075
  jump_upward_velocity: 1.2
  jump_reward_steps: 50
  
  # 報酬関数の重み
  reward_scales:
    tracking_lin_vel: 2.0      # 目標の前後・左右速度に追従する報酬
    tracking_ang_vel: 1.3      # 目標の旋回速度に追従する報酬
    lin_vel_z: -2.0            # 胴体が上下に跳ねる動きを抑える罰則
    orientation: -0.2          # 胴体のroll/pitchの傾きを抑える罰則
    base_height: -1.0          # 胴体高さを目標値付近に保つ罰則
    action_rate: -0.02         # 行動の急変を抑えて滑らかな動きにする罰則
    similar_to_default: -0.08  # 関節角度が初期姿勢から大きく外れるのを抑える罰則
    contact_leg_forward_vel_penalty: -0.3  # 接地中に脚を前後へ蹴る動きを抑え、車輪で転がる動きを促す

command_cfg:
  num_commands: 5  # [lin_vel_x, lin_vel_y, ang_vel, height, jump]
  # 前後・左右・旋回を混ぜて学習し、汎用的な平地歩行を作る。
  lin_vel_x_range: [-0.5, 1.0]
  lin_vel_y_range: [-0.5, 0.5]
  ang_vel_range: [-1.0, 1.0]
  height_range: [0.29, 0.29]
  # jump_range: [0.5, 1.5]
  jump_range: [0.0, 0.0]

train_cfg:
  exp_name: "true_wheel_0604"
  # 並列に見る環境数。GPUメモリに余裕がある場合はここを増やす。
  num_envs: 16384
  # 1環境あたりのrollout長。ここは増やさず、一度に見る環境数でbatchを増やす。
  num_steps_per_env: 24
  # rollout batchが大きくなった分、mini-batchサイズが大きくなりすぎないように分割数も増やす。
  num_mini_batches: 8
  num_learning_epochs: 5
  max_iterations: 10000
  # env: "Go2Env_Stair"  # Go2本体用。車輪付き確認後に戻す場合はこれを使う。
  env: "Go2WheelEnv"     # 一時確認用: Go2 + 受動車輪モデルを読み込む。
  device: "cuda:0"
  eval:
    enabled: false        # trueにすると学習中に評価を実行する
    interval: 100         # 何iterationごとに評価するか。
    num_envs: 16
    duration_s: 10.0
    save_csv: false        # logs/<exp_name>/eval.csvにも保存する
    commands:
      - name: forward
        lin_vel_x: 0.3
        lin_vel_y: 0.0
        ang_vel: 0.0
      - name: lateral_positive
        lin_vel_x: 0.0
        lin_vel_y: 0.3
        ang_vel: 0.0
      - name: yaw_negative
        lin_vel_x: 0.0
        lin_vel_y: 0.0
        ang_vel: -0.4
